version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns:
          - "androidx.*"
      kotlin-and-coroutines:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.kotlinx*"
      testing:
        patterns:
          - "io.mockk*"
          - "app.cash.turbine*"
          - "com.google.truth*"
          - "junit*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
