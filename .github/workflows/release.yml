name: Release

# Builds a distributable, signed release APK from a version tag.
#
# Unlike the CI smoke build, this uses the REAL Firebase configuration and the
# REAL upload key, so the resulting artifact reports crashes and can be
# installed as an update over previous versions.
#
# Required repository secrets (see RELEASE_SIGNING.md):
#   GOOGLE_SERVICES_JSON        real google-services.json contents
#   RELEASE_KEYSTORE_BASE64     base64 of the release keystore
#   RELEASE_KEYSTORE_PASSWORD   store password
#   RELEASE_KEY_ALIAS           key alias
#   RELEASE_KEY_PASSWORD        key password

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.2.0)"
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            VERSION_NAME="${{ github.event.inputs.version_name }}"
          else
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          fi
          # versionCode must increase on every release. github.run_number is
          # monotonic per workflow and never resets.
          VERSION_CODE="${{ github.run_number }}"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION_NAME ($VERSION_CODE)"

      - name: Write real google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. A release without a real Firebase config has no crash reporting."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          if grep -qE 'PLACEHOLDER|monitoring-dashboard-ci' app/google-services.json; then
            echo "::error::GOOGLE_SERVICES_JSON secret contains the CI placeholder."
            exit 1
          fi

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is not set."
            exit 1
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Lint (release)
        run: ./gradlew lintRelease --stacktrace

      - name: Build signed release APK
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Crashlytics mapping
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew firebaseCrashlyticsUploadMappingRelease --stacktrace

      - name: Verify APK is signed
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          echo "Verifying $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK"

      - name: Clean up secrets from workspace
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" app/google-services.json

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: monitoring-dashboard-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90

      - name: Upload mapping.txt
        uses: actions/upload-artifact@v4
        with:
          name: mapping-${{ steps.version.outputs.version_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
